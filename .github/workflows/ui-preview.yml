name: UI preview

# Screenshots of the Windows app on a real Windows machine, attached to the
# run as an artifact and pushed to the ui-previews branch for easy viewing. Runs on PRs that touch the desktop app.
on:
  pull_request:
    paths:
      - "_source/onepace_downloader.py"
      - ".github/scripts/ui_preview.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install
        run: pip install customtkinter==5.2.2 pillow "certifi>=2026.7.22"

      - name: Bigger screen
        shell: pwsh
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Screenshots
        run: python .github/scripts/ui_preview.py previews

      - uses: actions/upload-artifact@v4
        with:
          name: ui-previews
          path: previews

      - name: Publish to ui-previews branch
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          cd previews
          git init -q -b ui-previews
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "UI previews for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ui-previews
